name: Bilan quotidien des opportunités

on:
  # Le bilan automatique de 9 h (heure de Paris) ne tourne que si la variable FAB_AUTO vaut "true".
  # Elle se règle d'un clic depuis l'application locale (interrupteur « Bilan auto 9 h »).
  # GitHub compte en heure UTC sans heure d'été et peut sauter un déclenchement planifié
  # quand ses serveurs sont chargés (surtout à l'heure pile). Le workflow démarre donc
  # plusieurs fois entre 7 h et 10 h UTC, à des minutes décalées ; le programme ne fait
  # le bilan qu'une fois par jour, au premier passage à partir de 9 h (heure de Paris).
  # Les passages suivants s'arrêtent en quelques secondes, sans appel à Claude.
  schedule:
    - cron: "7,37 7-10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Mode test (sans appel à Claude, données d'exemple)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    if: github.event_name != 'schedule' || vars.FAB_AUTO == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Faire le bilan de l'actualité
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FAB_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FAB_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          # Réglages optionnels : Settings > Secrets and variables > Actions > onglet « Variables »
          FAB_MODEL: ${{ vars.FAB_MODEL }}
          FAB_EFFORT: ${{ vars.FAB_EFFORT }}
          FAB_MIN_SCORE_NOTIFY: ${{ vars.FAB_MIN_SCORE_NOTIFY }}
          FAB_MAX_ARTICLES: ${{ vars.FAB_MAX_ARTICLES }}
          FAB_DAILY_COST_LIMIT_USD: ${{ vars.FAB_DAILY_COST_LIMIT_USD }}
          FAB_MAX_BUDGET_EUR: ${{ vars.FAB_MAX_BUDGET_EUR }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          FAB_PAGES: ${{ vars.FAB_PAGES }}
        run: python -m fab.main

      - name: Sauvegarder les résultats dans le dépôt
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "find-a-business-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -q -m "Veille $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "Échec du push" && exit 1

  # Facultatif : tableau de bord en ligne via GitHub Pages (dépôt PUBLIC uniquement).
  # À activer avec la variable FAB_PAGES = true. Par défaut, le tableau de bord est joint au bilan Discord.
  pages:
    needs: veille
    if: ${{ vars.FAB_PAGES == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
