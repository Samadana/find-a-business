name: Bilan quotidien des opportunités

on:
  # Bilan lancé à la main chaque jour (bouton « Lancer un bilan » de l'application locale,
  # ou onglet Actions → Run workflow). Le planning automatique de GitHub a été retiré :
  # il sautait trop souvent des déclenchements.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Mode test (sans appel à Claude, données d'exemple)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Faire le bilan de l'actualité
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FAB_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FAB_FORCE: "1"
          # Réglages optionnels : Settings > Secrets and variables > Actions > onglet « Variables »
          FAB_MODEL: ${{ vars.FAB_MODEL }}
          FAB_EFFORT: ${{ vars.FAB_EFFORT }}
          FAB_MIN_SCORE_NOTIFY: ${{ vars.FAB_MIN_SCORE_NOTIFY }}
          FAB_MAX_ARTICLES: ${{ vars.FAB_MAX_ARTICLES }}
          FAB_ANALYSIS_BATCHES: ${{ vars.FAB_ANALYSIS_BATCHES }}
          FAB_DAILY_COST_LIMIT_USD: ${{ vars.FAB_DAILY_COST_LIMIT_USD }}
          FAB_MAX_BUDGET_EUR: ${{ vars.FAB_MAX_BUDGET_EUR }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          FAB_PAGES: ${{ vars.FAB_PAGES }}
        run: python -m fab.main

      - name: Sauvegarder les résultats dans le dépôt
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "find-a-business-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -q -m "Veille $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "Échec du push" && exit 1

  # Facultatif : tableau de bord en ligne via GitHub Pages (dépôt PUBLIC uniquement).
  # À activer avec la variable FAB_PAGES = true. Par défaut, le tableau de bord est joint au bilan Discord.
  pages:
    needs: veille
    if: ${{ vars.FAB_PAGES == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
